# The dev stack as a real install has it: one process tree, the Supervisor at
# the root, the Platform and the Shell as its children.
#
#   # once, in the web repository, to produce the Shell binary:
#   cd ../web
#   docker compose -f docker-compose.test.yml run --rm test \
#     npm run build --workspace packages/shell
#   docker compose -f docker-compose.test.yml run --rm shell-binary \
#     bash ../scripts/build-shell-binary.sh
#
#   # then, here:
#   cd ../platform
#   docker compose -f docker-compose.dev.yml -f docker-compose.supervisor.yml \
#     up postgres supervisor
#
# Then https://localhost:8443. The certificate is self-signed and generated per
# boot, so a browser will warn; that warning is the accurate description of it.
#
# Note what is NOT in that `up`: the `platform` service. The Supervisor starts
# the Platform itself here, which is the whole point — it is the shape ADR 0004
# describes and the one where ADR 0060's boot id is honoured end to end, since
# a process compose started mints its own id and cannot adopt anybody's. The
# Platform is consequently on the Supervisor's *own* loopback, reachable only
# through the front door, exactly as a deployed install has it.
#
# **This is an overlay, not the default dev loop.** `docker-compose.dev.yml`
# alone still gives you Vite on :5173 with hot reload and the Platform on
# :8081, which is right for working on either. Use this one to exercise
# process supervision, TLS termination, routing and the degradation ladder.
#
# The Shell binary is a stated prerequisite because building it needs Node and
# these images do not carry it. The Platform's binary is built for you by the
# `platform-build` service below, and the Supervisor is `go run` from its
# sibling checkout — it imports the standard library alone, so that costs
# seconds.
#
# ../supervisor is the assumed sibling path. Override it with
# MOSAIC_SUPERVISOR_SRC if a checkout of some other, unrelated project already
# occupies that name on your machine.
name: mosaic-dev

services:
  # Compiles the Platform once, into a volume, so the Supervisor execs a binary
  # rather than `go run`. That matters here beyond speed: `go run` compiles on
  # every start, so a restart would take minutes and the restart path — the
  # thing this overlay exists to exercise — would be untestable. It is also
  # what a release does (ADR 0063).
  platform-build:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      TMDB_RAC: "${TMDB_RAC:-}"
    volumes:
      - .:/src/platform
      - mosaic-dev-gomod:/go/pkg/mod
      - mosaic-dev-gobuild:/root/.cache/go-build
      - mosaic-dev-bin:/out
    working_dir: /src/platform
    command:
      - sh
      - -c
      - >-
        go build -ldflags "-X github.com/mosaic-media/module-tmdb.defaultReadAccessToken=$${TMDB_RAC}"
        -o /out/mosaic-platform ./cmd/mosaic-platform

  # The Supervisor, compiled for the same reason as the Platform above and one
  # more that is specific to it: it must run as the container's own process so
  # a `docker compose stop` reaches it. Under `go run` the toolchain is the
  # process being signalled, the Supervisor never sees SIGTERM, and every child
  # is killed by Docker rather than stopped in order — which makes the one
  # behaviour this overlay exists to exercise impossible to observe.
  supervisor-build:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ${MOSAIC_SUPERVISOR_SRC:-../supervisor}:/src/supervisor:ro
      - mosaic-dev-gomod:/go/pkg/mod
      - mosaic-dev-gobuild:/root/.cache/go-build
      - mosaic-dev-bin:/out
    working_dir: /src/supervisor
    command: ["go", "build", "-o", "/out/mosaic-supervisor", "./cmd/mosaic-supervisor"]

  supervisor:
    # Dockerfile.dev rather than a plain Go image: the Supervisor needs none of
    # ffmpeg, but the Platform it starts as a child does (ADR 0050), and a
    # child inherits its parent's container.
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Stopping this container stops the whole tree, so give the Supervisor
    # longer than compose's default 10s: it drains the front door, then stops
    # the Shell and the Platform in order, each with its own grace.
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      platform-build:
        condition: service_completed_successfully
      supervisor-build:
        condition: service_completed_successfully
    environment:
      MOSAIC_SUPERVISOR_ADDR: ":8443"
      # Both children are on this container's own loopback now, reachable
      # only through the front door.
      MOSAIC_SUPERVISOR_PLATFORM_URL: "http://127.0.0.1:8081"
      MOSAIC_SUPERVISOR_PLATFORM_HANDOFF_URL: "http://127.0.0.1:8080"
      MOSAIC_SUPERVISOR_SHELL_URL: "http://127.0.0.1:8090"
      MOSAIC_SUPERVISOR_PLATFORM_COMMAND: "/opt/mosaic/mosaic-platform"
      MOSAIC_SUPERVISOR_PLATFORM_DIR: "/src/platform"
      MOSAIC_SUPERVISOR_SHELL_COMMAND: "/src/web/mosaic-shell/mosaic-shell"

      # The Platform's own configuration. It reaches the child because a child
      # inherits the Supervisor's environment — which is the Supervisor booting
      # the Platform (ADR 0004), not a leak.
      MOSAIC_POSTGRES_DSN: "postgres://mosaic:mosaic@postgres:5432/mosaic?sslmode=disable"
      MOSAIC_API_ADDR: ":8081"
      MOSAIC_HEALTH_ADDR: ":8080"
      MOSAIC_INSTANCE_FILE: "/var/lib/mosaic/instance.json"
      MOSAIC_BOOTSTRAP_ADMIN_USERNAME: "${MOSAIC_BOOTSTRAP_ADMIN_USERNAME:-}"
      MOSAIC_BOOTSTRAP_ADMIN_PASSWORD: "${MOSAIC_BOOTSTRAP_ADMIN_PASSWORD:-}"
    volumes:
      - ${MOSAIC_SUPERVISOR_SRC:-../supervisor}:/src/supervisor:ro
      # The Platform's source, for the extension install directory it resolves
      # relative to its working directory (ADR 0081).
      - .:/src/platform
      # The Shell binary, read-only: the Supervisor executes it, never writes
      # to it.
      - ../web:/src/web:ro
      - mosaic-dev-bin:/opt/mosaic:ro
      - mosaic-dev-gomod:/go/pkg/mod
      - mosaic-dev-gobuild:/root/.cache/go-build
      - mosaic-dev-state:/var/lib/mosaic
    working_dir: /src/supervisor
    ports:
      # 8443 rather than 443 so it needs no privileged port, and so it cannot
      # collide with anything already fronting this machine.
      - "8443:8443"
    command: ["/opt/mosaic/mosaic-supervisor"]

volumes:
  mosaic-dev-bin:
